<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments :: userbar}"></div>
<h1 th:text="${title}">Catalogue</h1>
<p th:if="${message}" class="flash" th:text="${message}"></p>
<p th:if="${author}" class="filter">Filter by author: <b th:text="${author}">Bloch</b> · <a th:href="@{/books}">reset</a></p>

<table>
    <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th><th sec:authorize="hasRole('ADMIN')"></th></tr>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
        <td sec:authorize="hasRole('ADMIN')">
            <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

<!-- only ADMIN sees the form; POST /books is closed for USER on the server anyway -->
<section sec:authorize="hasRole('ADMIN')">
    <h2>Add a book</h2>
    <form th:action="@{/books}" method="post">
        <input name="title" placeholder="Title" required>
        <input name="author" placeholder="Author" required>
        <input name="year" type="number" placeholder="Year" required>
        <button type="submit">Add</button>
    </form>
</section>
</body>
</html>
