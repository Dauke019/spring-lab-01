<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- lab 10, task 3.3: the view knows who is looking at it.
     Hiding a link is courtesy, not control: the server rules decide. -->
<div th:fragment="userbar" class="userbar">
    <a th:href="@{/}">Home</a>
    <a th:href="@{/books}">Catalogue</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Administration</a>
    <span class="spacer"></span>
    <span sec:authorize="isAuthenticated()">
        Signed in as <b sec:authentication="name">anonymous</b>
        <span class="roles" sec:authentication="principal.authorities">[ROLE_USER]</span>
    </span>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline">
        <button type="submit">Log out</button>
    </form>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">Log in</a>
</div>
</body>
</html>
